  $("#b-import").onclick = () => { if (writable()) $("#b-file").click(); };
  // A restore merges into what is already here; documents with the same id are replaced.
  $("#b-file").onchange = async ev => {
    const f = ev.target.files[0];
    ev.target.value = "";
    if (!f || !writable()) return;
    if (/\.xlsx$/i.test(f.name)) { importXlsx(f); return; }
    let d;
    try { d = JSON.parse(await f.text()); } catch (e) { toast("Bu dosya okunamadı."); return; }
    const obj = x => x && typeof x === "object" && !Array.isArray(x) ? x : null;
    const evs = obj(d && d.events) || {}, cs = obj(d && d.courses) || {};
    const ks = cleanKinds(Array.isArray(d && d.kinds) ? d.kinds : []);
    const okEv = Object.entries(evs).filter(([id, x]) => norm(id, x));
    const okCs = Object.entries(cs).filter(([id, x]) => normCourse(id, x));
    const ts = cleanTodos(d && d.todos);
    if (!okEv.length && !okCs.length && !ks.length && !ts.length) { toast("Dosyada takvim verisi yok."); return; }
    const before = JSON.stringify(store);
    for (const [id, x] of okEv) store.events[id] = x;
    for (const [id, x] of okCs) store.courses[id] = x;
    const have = new Set(store.kinds.map(k => k.id));
    for (const k of ks) if (!have.has(k.id)) store.kinds.push(k);
    const haveT = new Set(store.todos.map(t => t.id));
    for (const t of ts) if (!haveT.has(t.id)) store.todos.push(t);
    const ls = cleanLinks(d && d.links);
    if (ls) { const mine = store.links || DEFAULT_LINKS, urls = new Set(mine.map(l => l.url)); store.links = [...mine, ...ls.filter(l => !urls.has(l.url))]; }
    const sl = cleanSlots(d && d.slots);
    if (sl && !store.slots) store.slots = sl;
    const kes = cleanKindEdits(d && d.kindEdits);
    for (const k in kes) if (!store.kindEdits[k]) store.kindEdits[k] = kes[k];
    persist().then(
      () => toast(`${okEv.length} etkinlik, ${okCs.length} ders yüklendi`),
      err => { store = JSON.parse(before); writeFailed(err); }
    );
  };

  /* Excel import. An .xlsx file is a zip of XML parts; this reads the first sheet with the browser's own
     decompressor, so no library is loaded and the file never leaves the device. */
  async function unzipEntries(buf) {
    const dv = new DataView(buf), bytes = new Uint8Array(buf), out = {};
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error("zip");
    let p = dv.getUint32(eocd + 16, true);
    const n = dv.getUint16(eocd + 10, true), dec = new TextDecoder();
    for (let e = 0; e < n; e++) {
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true), name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      out[name] = {method, data: bytes.subarray(start, start + size)};
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }
  async function entryText(entry) {
    if (!entry) return "";
    if (entry.method === 0) return new TextDecoder().decode(entry.data);
    const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }
  async function readXlsxRows(file) {
    const files = await unzipEntries(await file.arrayBuffer()), parse = t => new DOMParser().parseFromString(t, "application/xml");
    const shared = [...parse(await entryText(files["xl/sharedStrings.xml"])).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
    const sheetName = Object.keys(files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    const sheet = parse(await entryText(files[sheetName])), rows = [];
    for (const r of sheet.getElementsByTagName("row")) {
      const row = [];
      for (const c of r.getElementsByTagName("c")) {
        const col = (c.getAttribute("r") || "").replace(/\d+/g, "").split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0];
        row[col] = t === "s" ? shared[Number(v && v.textContent)] : t === "inlineStr" ? [...c.getElementsByTagName("t")].map(x => x.textContent).join("") : v ? v.textContent : "";
      }
      rows.push(row.map(x => x == null ? "" : String(x)));
    }
    return rows;
  }

  // METU Rez export: one row per session, "Seans 10.12.2023 / 14.00 - 15.30"; "Aktif: Hayır" rows were cancelled and are skipped.
  // Sessions land under a "Spor" kind (made on first import); re-importing the same file adds nothing twice.
  function sporKind() {
    const found = Object.entries(KINDS).find(([, v]) => lower(v.label) === "spor");
    if (found) return found[0];
    store.kinds = [...store.kinds, {id: "kspor", label: "Spor", color: 7}];
    S.picks.add("kspor");
    savePicks();
    return "kspor";
  }
  async function importXlsx(file) {
    let rows;
    try { rows = await readXlsxRows(file); } catch (e) { toast("Bu Excel dosyası okunamadı."); return; }
    const head = (rows[0] || []).map(lower), col = name => head.findIndex(h => h.includes(name));
    const iT = col("tesis"), iS = col("seans"), iA = col("aktif");
    if (iT < 0 || iS < 0) { toast("Bu Excel METU Rez dışa aktarımına benzemiyor."); return; }
    const before = JSON.stringify(store), kind = sporKind();
    let added = 0, same = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})\s*\/\s*(\d{1,2}[.:]\d{2})\s*-\s*(\d{1,2}[.:]\d{2})/.exec(r[iS] || "");
      if (!m) continue;
      if (iA >= 0 && lower(r[iA]).startsWith("hay")) { skipped++; continue; }
      const date = `${m[3]}-${pad(m[2])}-${pad(m[1])}`, from = m[4].replace(":", "."), to = m[5].replace(":", ".");
      const place = (r[iT] || "").trim(), title = place.split(" - ").pop() || "Spor";
      const id = `rez-${date}-${from.replace(".", "")}-${lower(title).replace(/[^a-z0-9ğüşöçı]+/g, "-").slice(0, 30)}`;
      if (store.events[id]) { same++; continue; }
      store.events[id] = {date, time: from, title, place, kind, tentative: false, note: `${from}–${to}`};
      added++;
    }
    persist().then(() => {
      const parts = [`${added} rezervasyon eklendi`];
      if (same) parts.push(`${same} zaten vardı`);
      if (skipped) parts.push(`${skipped} iptal atlandı`);
      toast(parts.join(" · "), added ? {label: "Geri al", run: () => { store = JSON.parse(before); persist().then(() => toast("Geri alındı"), writeFailed); }} : undefined);
    }, err => { store = JSON.parse(before); writeFailed(err); });
  }

  function icsText() {
    const esc = t => String(t).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
    const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const hm = m => pad(Math.floor(m / 60)) + pad(m % 60) + "00";
    const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Guz Takvimi//TR", "CALSCALE:GREGORIAN"];
    for (const e of S.events) {
      if (e.reminder) continue;
      const d = e.date.replace(/-/g, ""), m = mins(e.time);
      out.push("BEGIN:VEVENT", `UID:${e.id}@guz-takvimi`, `DTSTAMP:${stamp}`);
      if (m != null) out.push(`DTSTART:${d}T${hm(m)}`, `DTEND:${d}T${hm(Math.min(m + 60, 23 * 60 + 59))}`);
      else {
        const next = new Date(parseKey(e.date).getTime() + 864e5);
        out.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${keyOf(next).replace(/-/g, "")}`);
      }
      if (e.repeat) {
        const freq = {day: "DAILY", week: "WEEKLY", month: "MONTHLY", year: "YEARLY"}[e.repeat.unit];
        const until = e.repeat.until ? `;UNTIL=${e.repeat.until.replace(/-/g, "")}${m != null ? "T235959" : ""}` : "";
        out.push(`RRULE:FREQ=${freq};INTERVAL=${e.repeat.every}${until}`);
        for (const k of e.skip) {
          const x = k.replace(/-/g, "");
          out.push(m != null ? `EXDATE:${x}T${hm(m)}` : `EXDATE;VALUE=DATE:${x}`);
        }
      }
      out.push(`SUMMARY:${esc((e.tentative ? "(kesin değil) " : "") + e.title)}`);
      if (e.place) out.push(`LOCATION:${esc(e.place)}`);
      const desc = [kindOf(e).label, m == null ? e.time : "", e.note].filter(Boolean).join(" · ");
      if (desc) out.push(`DESCRIPTION:${esc(desc)}`);
      out.push("END:VEVENT");
    }
    out.push("END:VCALENDAR");
    return out.join("\r\n") + "\r\n";
  }
  $("#b-ics").onclick = () => {
    if (!S.events.length) { toast("Aktarılacak etkinlik yok."); return; }
    download("guz-takvim.ics", icsText(), "text/calendar");
    toast("Dosyayı aç, telefonun takvimine eklenir");
  };

  /* sound: a tiny tap when the pointer reaches a new box or button, a quiet mouse click when one is clicked.
     Synthesized with Web Audio, so there are no sound files; browsers stay silent until the first click. */
  const DEFAULT_LINKS = [
    {id: "odtuclass", title: "ODTÜClass", url: "https://odtuclass2026f.metu.edu.tr/"},
    {id: "rez", title: "METU Rez", url: "https://rez.metu.edu.tr/"},
    {id: "sais", title: "METU SAİS", url: "https://student.metu.edu.tr/"},
    {id: "mail", title: "METU Mail", url: "https://metumail.metu.edu.tr/"}
  ];
  const SOUND_TARGET = "button, label.kchip, .kcolors label, .tt-block";
  let soundOn = saved("tk.sound") !== "off", audio = null, lastHover = null, lastTick = 0;
  // Everything plays through one soft chain: a low-pass to take the edge off, a compressor so no tap peaks.
  // The audio context is only created inside a click or key press (Safari and its Dock web apps keep a context
  // made earlier muted), and a silent one-sample buffer is played then to unlock output.
  let out = null;
  function ctx() {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      const lp = audio.createBiquadFilter(), comp = audio.createDynamicsCompressor(), g = audio.createGain();
      lp.type = "lowpass";
      lp.frequency.value = 3200;
      comp.threshold.value = -20;
      comp.ratio.value = 4;
      comp.attack.value = 0.001;
      comp.release.value = 0.05;
      g.gain.value = 0.8;
      lp.connect(comp).connect(g).connect(audio.destination);
      out = lp;
    }
    return audio;
  }
  function unlock() {
    if (!soundOn) return;
    try {
      const a = ctx();
      if (a.state !== "running") a.resume();
      const src = a.createBufferSource();
      src.buffer = a.createBuffer(1, 1, 22050);
      src.connect(a.destination);
      src.start(0);
    } catch (e) {}
  }
  document.addEventListener("pointerdown", unlock, true);
  document.addEventListener("keydown", unlock, true);
  // A tap is a short burst of band-passed noise that fades in over 1.5 ms instead of starting at full level.
  // Hover taps play only once audio is running; click taps wait for the context to wake up.
  function tap(dur, freq, q, gain, delay = 0, wake = false) {
    if (!soundOn || (!wake && (!audio || audio.state !== "running"))) return;
    try {
      const a = ctx(), play = () => {
        const sr = a.sampleRate, len = Math.floor(sr * dur), atk = Math.max(1, Math.floor(sr * 0.0015));
        const buf = a.createBuffer(1, len, sr), ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.min(1, i / atk) * Math.pow(1 - i / len, 3);
        const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
        src.buffer = buf;
        bp.type = "bandpass";
        bp.frequency.value = freq;
        bp.Q.value = q;
        g.gain.value = gain;
        src.connect(bp).connect(g).connect(out);
        src.start(a.currentTime + delay);
      };
      if (a.state === "running") play();
      else a.resume().then(play, () => {});
    } catch (e) {}
  }
  const hoverSound = () => tap(0.008, 1400, 2, 0.16);
  // A quiet mouse: the press, then a softer release 60 ms later.
  const clickSound = () => { tap(0.012, 1700, 2, 0.55, 0, true); tap(0.01, 1500, 2, 0.25, 0.06, true); };
  document.addEventListener("pointerover", ev => {
    if (ev.pointerType !== "mouse") return;
    const target = ev.target.closest(SOUND_TARGET);
    if (!target || target === lastHover || target.disabled) return;
    lastHover = target;
    const now = performance.now();
    if (now - lastTick < 45) return;
    lastTick = now;
    hoverSound();
  });
  document.addEventListener("pointerout", ev => { if (lastHover && !lastHover.contains(ev.relatedTarget)) lastHover = null; });
  document.addEventListener("click", ev => {
    const target = ev.target.closest(SOUND_TARGET);
    if (target && !target.disabled) clickSound();
  });
  // A purr: about 24 soft, low-passed breaths of noise per second, swelling in and out over under a second.
  let lastPurr = 0;
  function purr() {
    if (!soundOn || !audio || audio.state !== "running" || performance.now() - lastPurr < 1500) return;
    lastPurr = performance.now();
    try {
      const a = audio, sr = a.sampleRate, dur = 0.8, len = Math.floor(sr * dur);
      const buf = a.createBuffer(1, len, sr), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const t = i / sr, rate = 23 + 3 * Math.sin(t * 5);
        const beat = Math.pow(Math.max(0, Math.sin(2 * Math.PI * rate * t)), 4);
        const env = Math.min(1, t / 0.12) * Math.min(1, (dur - t) / 0.3);
        ch[i] = (Math.random() * 2 - 1) * beat * env;
      }
      const src = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf;
      lp.type = "lowpass";
      lp.frequency.value = 300;
      lp.Q.value = 0.8;
      g.gain.value = 1.6;
      src.connect(lp).connect(g).connect(out);
      src.start();
    } catch (e) {}
  }
  const catEl = $(".cat");
  catEl.addEventListener("pointerover", ev => { if (!catEl.contains(ev.relatedTarget)) purr(); });

  // Links are the user's own list, kept with the calendar data; until it is edited the four METU sites are shown.
  const linksPop = $("#links-pop"), linksBtn = $("#links-btn");
  let linksEdit = false;
  const foldLinks = open => {
    linksPop.hidden = !open;
    linksBtn.setAttribute("aria-expanded", String(open));
    if (!open && linksEdit) { linksEdit = false; renderLinks(); }
  };
  linksBtn.onclick = () => foldLinks(linksPop.hidden);
  // composedPath still knows where a click started even if a re-render removed that element meanwhile.
  const inside = (ev, sel) => ev.composedPath().some(n => n.matches && n.matches(sel));
  document.addEventListener("click", ev => { if (!inside(ev, "#links")) foldLinks(false); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") foldLinks(false); });
  linksPop.addEventListener("click", ev => { if (ev.target.closest("a")) foldLinks(false); });
  const linkList = () => store.links || DEFAULT_LINKS;
  function setLinks(list) {
    const before = store.links;
    store.links = list;
    persist().catch(err => { store.links = before; writeFailed(err); });
  }
  function renderLinks() {
    linksPop.replaceChildren();
    linksPop.classList.toggle("editing", linksEdit);
    const list = linkList(), tool = (text, fn) => { const b = el("button", "ltool", text); b.type = "button"; b.onclick = fn; linksPop.append(b); };
    if (!linksEdit) {
      for (const l of list) {
        const a = el("a", null, l.title || new URL(l.url).hostname);
        a.href = l.url; a.target = "_blank"; a.rel = "noopener";
        linksPop.append(a);
      }
      if (!list.length) linksPop.append(el("p", "empty", "Henüz link yok."));
      if (writable()) tool("Linkleri düzenle", () => { linksEdit = true; renderLinks(); });
      return;
    }
    for (const l of list) {
      const row = el("div", "lrow"), inp = el("input"), del = el("button", "tdel", "×");
      inp.value = l.title;
      inp.maxLength = 40;
      inp.setAttribute("aria-label", `Başlık: ${l.title}`);
      inp.title = l.url;
      inp.onchange = () => setLinks(linkList().map(x => x.id === l.id ? {...x, title: inp.value.trim() || x.title} : x));
      inp.onkeydown = ev => { if (ev.key === "Enter") inp.blur(); };
      del.type = "button";
      del.setAttribute("aria-label", `Sil: ${l.title}`);
      del.onclick = () => setLinks(linkList().filter(x => x.id !== l.id));
      row.append(inp, del);
      linksPop.append(row);
    }
    const add = el("form", "lnew"), t = el("input"), u = el("input"), ok = el("button", "small-btn sun", "Ekle");
    t.placeholder = "Başlık"; t.maxLength = 40; t.setAttribute("aria-label", "Yeni link başlığı");
    u.placeholder = "Adres (örn. odtuclass.metu.edu.tr)"; u.setAttribute("aria-label", "Yeni link adresi");
    add.append(t, u, ok);
    add.onsubmit = ev => {
      ev.preventDefault();
      let url = u.value.trim();
      if (!url) { u.focus(); return; }
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      try { new URL(url); } catch (e) { toast("Bu adres geçerli görünmüyor."); return; }
      setLinks([...linkList(), {id: newId(), title: t.value.trim() || new URL(url).hostname, url}]);
    };
    linksPop.append(add);
    tool("Bitti", () => { linksEdit = false; renderLinks(); });
  }

  const soundBtn = $("#sound-btn");
  function syncSound() {
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "Sesleri kapat" : "Sesleri aç");
    soundBtn.title = soundOn ? "Sesler açık" : "Sesler kapalı";
  }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    saved("tk.sound", soundOn ? "on" : "off");
    syncSound();
  });
  syncSound();

  /* load: probe storage once, then read */
  try {
    localStorage.setItem(STORE_KEY + ".probe", "1");
    localStorage.removeItem(STORE_KEY + ".probe");
    store = loadStore();
    S.db = true;
    S.base = "local";
  } catch (e) { S.db = null; }
  S.loaded = true;
  if (S.db) refresh(); else render();
  // Another tab of the same page saved: pick up its version.
  window.addEventListener("storage", ev => {
    if (ev.key !== STORE_KEY) return;
    try { store = loadStore(); refresh(); } catch (e) {}
  });
})();
</script>
</body>
</html>
