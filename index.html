<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Güz 2026 Takvimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticker cards on a dotted sky board. Add bar on top, calendar card + filter rail side by side, stacking on phones. */
:root{
  --bg:#E6F3FA; --dot:#C6DCE9; --surface:#FFFFFF; --card:#F3F1F6; --text:#2A2933; --muted:#6D6B7B; --line:#2A2933;
  --teal:#8ED3C9; --pink:#F8CDE1; --sun:#F6D46E; --lilac:#D6CCF5; --mist:#D8E3EC; --on-tint:#2A2933;
  --alert:#D9475C; --alert-on:#FFFFFF; --mark:#FFFFFF;
  --c1:#9ED8EE; --c2:#F5B5B5; --c3:#CFD8E0; --c4:#B3E8DD; --c5:#FBCB96; --c6:#A6DB95; --c7:#DCCFF7; --c8:#F4E08C; --flag:#FF9F8A; --grid:#D3DEE7; --slot-h:54px;
  --f-display:"Fredoka","Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --bw:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#172030; --dot:#25324A; --surface:#222B3A; --card:#2A3344; --text:#F1ECE2; --muted:#A4AABA; --line:#06080D;
  --teal:#79C4B9; --pink:#E8AFC9; --sun:#E5C157; --lilac:#B9ADE8; --mist:#AFBECB; --on-tint:#1C1C24;
  --alert:#FF8597; --alert-on:#2A0D13; --mark:#F1ECE2;
  --c1:#7BBFD8; --c2:#E39A9A; --c3:#AAB6C2; --c4:#8FD2C4; --c5:#E6B074; --c6:#88C677; --grid:#34415A; --c7:#B9ADE8; --c8:#DCC567; --flag:#EE8B74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#172030; --dot:#25324A; --surface:#222B3A; --card:#2A3344; --text:#F1ECE2; --muted:#A4AABA; --line:#06080D;
  --teal:#79C4B9; --pink:#E8AFC9; --sun:#E5C157; --lilac:#B9ADE8; --mist:#AFBECB; --on-tint:#1C1C24;
  --alert:#FF8597; --alert-on:#2A0D13; --mark:#F1ECE2;
  --c1:#7BBFD8; --c2:#E39A9A; --c3:#AAB6C2; --c4:#8FD2C4; --c5:#E6B074; --c6:#88C677; --grid:#34415A; --c7:#B9ADE8; --c8:#DCC567; --flag:#EE8B74; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1.5px,transparent 1.8px);
  background-size:24px 24px;
  color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 56px;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:22px}
.sticker{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:3px 4px 0 var(--line)}

/* brand */
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px}
.brand svg{flex:none}
.spark{width:44px;height:20px;align-self:flex-start;margin-top:10px}
.spark rect,.pin .tag{fill:var(--mark);stroke:var(--line);stroke-width:2.2}
.pin{width:40px;height:58px;align-self:flex-start}
.pin line{stroke:var(--line);stroke-width:2.6;stroke-linecap:round}
.pin .bead{fill:var(--sun);stroke:var(--line);stroke-width:2.4}
.mark{margin:0;display:flex;font-family:var(--f-display);font-weight:700;font-size:clamp(46px,10vw,78px);line-height:1.05;letter-spacing:.02em;
  color:var(--mark);-webkit-text-stroke:4px var(--line);paint-order:stroke fill;text-shadow:4px 5px 0 var(--sun)}
.mark span{display:inline-block}
.mark span:nth-child(odd){transform:rotate(-5deg) translateY(3px)}
.mark span:nth-child(even){transform:rotate(4deg) translateY(-2px)}
.season{align-self:flex-end;margin-bottom:10px;transform:rotate(5deg);font:600 14px var(--f-display);letter-spacing:.04em;
  background:var(--pink);color:var(--on-tint);border:var(--bw) solid var(--line);border-radius:999px;padding:3px 12px;box-shadow:2px 3px 0 var(--line)}

/* add bar */
.addbar{overflow:hidden;max-width:880px;width:100%;margin:0 auto}
.addbar:focus-within{box-shadow:3px 4px 0 var(--line),0 0 0 4px var(--teal)}
.add-top{display:flex;align-items:stretch;min-width:0}
.edit-tag{align-self:center;margin-left:14px;flex:none;font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;
  background:var(--sun);color:var(--on-tint);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px}
#f-title{flex:1;min-width:0;border:0;background:transparent;font:600 clamp(16px,2.4vw,20px)/1.2 var(--f-body);padding:18px;outline:none}
#f-title::placeholder{color:var(--muted);font-weight:500}
.btn-add{flex:none;border:0;border-left:var(--bw) solid var(--line);background:var(--pink);color:var(--on-tint);font:600 19px var(--f-display);padding:0 30px;cursor:pointer}
.addbar.editing .btn-add{background:var(--sun)}
.btn-add:disabled{cursor:default;opacity:.6}
.add-more{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;padding:12px 16px 14px;background:var(--card);border-top:1.5px dashed var(--line)}
.fld{display:grid;gap:4px;min-width:0}
.fl{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fld input{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:600;font-size:14px;min-width:0;width:100%}
.fld input::placeholder{color:var(--muted);font-weight:500}
.fld-date{width:156px}.fld-time{width:96px}.fld.grow{flex:1 1 160px}
.kinds{display:grid;gap:4px}
.rep{flex:1 1 100%;display:grid;gap:4px;padding-bottom:12px;border-bottom:1.5px dashed var(--line)}
.rep-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.rep-custom{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding-bottom:4px}
.rep-custom input,.rep-custom select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;font-weight:600;font-size:14px}
.rep-custom input{width:56px}
.ev-ask{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{position:relative}
.kchip span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;background:var(--surface);cursor:pointer;user-select:none}
.kchip span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--k);border:1.5px solid var(--line)}
.kchip input:checked + span{background:var(--k);color:var(--on-tint);box-shadow:2px 2px 0 var(--line)}
.kchip input:focus-visible + span{outline:3px solid var(--line);outline-offset:2px}
.kchip input:disabled + span{opacity:.55;cursor:default}
.tent{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding-bottom:7px;cursor:pointer}
.tent input{width:17px;height:17px;accent-color:var(--alert);margin:0}
.link-btn{border:0;background:none;padding:0 0 7px;font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.msg{margin:0;padding:0 16px 12px;background:var(--card);color:var(--alert);font-weight:800;font-size:14px}

/* board */
/* The month view takes the full width; the side panels sit in a row underneath it. */
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.cal{overflow:hidden;min-width:0}
.cal-head{display:flex;flex-wrap:wrap;border-bottom:var(--bw) solid var(--line)}
.tabs{display:flex;border-right:var(--bw) solid var(--line)}
.tab{border:0;background:var(--surface);font:600 17px var(--f-display);padding:12px 24px;cursor:pointer}
.tab+.tab{border-left:var(--bw) solid var(--line)}
.tab[aria-selected="true"]{background:var(--teal);color:var(--on-tint)}
.cal-title{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;min-width:0}
.cal-title h2{margin:0;flex:1;min-width:0;font:600 21px var(--f-display);text-wrap:balance}
.nav{display:flex;gap:6px;align-items:center}
.icon-btn,.small-btn{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;font:600 20px/1 var(--f-display)}
.small-btn{padding:5px 12px;font-weight:800;font-size:13px}
.small-btn.sun{background:var(--sun);color:var(--on-tint)}
.icon-btn:active,.small-btn:active,.btn-add:active{transform:translate(1px,2px);box-shadow:none}

.month{padding:14px;display:grid;gap:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow span{text-align:center;font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell{min-width:0;min-height:118px;display:flex;flex-direction:column;gap:4px;padding:5px;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.cell.out{background:transparent;border-style:dashed;opacity:.5}
.cell.past:not(.today) .num{color:var(--muted)}
.cell[aria-pressed="true"]{background:var(--surface);box-shadow:3px 3px 0 var(--line);transform:translate(-1px,-1px)}
.cell-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.num{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font:600 14px var(--f-display);font-variant-numeric:tabular-nums}
.cell.today .num{background:var(--pink);color:var(--on-tint);border:1.5px solid var(--line)}
.warn{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--alert);color:var(--alert-on);font:800 11px/1 var(--f-body)}
.pills{display:grid;gap:3px;min-width:0}
.pill{display:block;min-width:0;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--k);color:var(--on-tint);font:700 11px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.tent{border-style:dashed}
.more{font:800 11px var(--f-body);color:var(--muted);padding-left:2px}

.day{border-top:var(--bw) solid var(--line);padding:16px;display:grid;gap:12px}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.day-head h3{margin:0;font:600 20px var(--f-display)}
.day-head .small-btn{margin-left:auto}
.rel{font-weight:800;font-size:13px;color:var(--muted)}
.empty{margin:0;color:var(--muted);font-weight:700}

.list{padding:16px;display:grid;gap:20px}
.list-tools{display:flex;justify-content:flex-end}
.mhead{margin:0 0 10px;display:flex;align-items:center;gap:10px;font:600 15px var(--f-display);letter-spacing:.08em}
.mcount{font:800 11px var(--f-body);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;letter-spacing:0}

.evs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ev{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:3px 4px 0 var(--line);padding:10px 10px 10px 14px}
.ev.past{opacity:.6}
.ev-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.ev-main:disabled{cursor:default}
.ev-dot{flex:none;width:30px;height:30px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--k)}
.ev-date{flex:none;width:52px;display:grid;justify-items:center;padding:4px 0;border:var(--bw) solid var(--line);border-radius:12px;background:var(--k);color:var(--on-tint)}
.ev-date b{font:600 22px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.ev-date small{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.ev-body{display:grid;gap:3px;min-width:0}
.ev-title{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.ev-meta{font-weight:600;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ev-meta b{color:var(--text);font-weight:800}
.ev-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:800 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface)}
.chip.kind{background:var(--k);color:var(--on-tint)}
.chip.tent{border-style:dashed}
.chip.clash{background:var(--alert);color:var(--alert-on);border-color:var(--alert)}
.ev-del{flex:none;min-width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:999px;background:none;cursor:pointer}
.ev-del svg{width:32px;height:32px}
.ev-del[data-armed="1"]{background:var(--alert);color:var(--alert-on);padding:0 14px;font-weight:800;font-size:13px}

/* rail */
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.rail .status{grid-column:1/-1}
.menu{overflow:hidden}
.menu-head{background:var(--teal);color:var(--on-tint);font:600 18px var(--f-display);letter-spacing:.06em;text-align:center;padding:10px;border-bottom:var(--bw) solid var(--line)}
.menu-head.sun{background:var(--sun)}
.menu-head.lilac{background:var(--lilac)}
.filters{display:grid}
.frow{display:flex;align-items:center;gap:10px;border:0;border-bottom:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;padding:10px 14px;cursor:pointer;text-align:left}
.frow:last-child{border-bottom:0}
.frow[aria-pressed="true"]{background:var(--pink);color:var(--on-tint)}
.sw{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);background:var(--k)}
.cnt{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;opacity:.7}
.next-box{display:grid}
.nx{display:grid;gap:1px;border:0;border-bottom:1.5px solid var(--line);background:var(--surface);padding:10px 14px 10px 18px;text-align:left;cursor:pointer;position:relative}
.nx:last-child{border-bottom:0}
.nx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--k);border-right:1.5px solid var(--line)}
.nx-when{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.nx-title{font-weight:800;overflow-wrap:anywhere}
.nx-rel{font-size:13px;font-weight:700;color:var(--muted)}
.next-box .empty{padding:12px 14px}
.status{margin:0;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:3px 4px 0 var(--line);padding:9px 10px 9px 18px;font-weight:800}
.toast button{border:1.5px solid var(--line);border-radius:999px;background:var(--sun);color:var(--on-tint);padding:4px 12px;font-weight:800;font-size:13px;cursor:pointer}

/* deadline banner */
.banner{display:grid;max-width:880px;width:100%;margin:0 auto;overflow:hidden}
.bn-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border:0;background:var(--surface);padding:10px 16px 10px 10px;text-align:left;cursor:pointer}
.bn-row+.bn-row{border-top:1.5px solid var(--line)}
.bn-count{flex:none;background:var(--flag);color:var(--on-tint);border:var(--bw) solid var(--line);border-radius:10px;padding:3px 10px;font:600 16px var(--f-display);font-variant-numeric:tabular-nums}
.bn-text{flex:1 1 220px;min-width:0;font-weight:800;overflow-wrap:anywhere}
.bn-when{font-weight:700;font-size:14px;color:var(--muted)}
.bn-head{background:var(--card)}
.bn-head[aria-expanded="true"] .bn-text{font:600 16px var(--f-display);letter-spacing:.02em}
.bn-more{font-weight:800;font-size:13px;color:var(--muted)}
.bn-chev{margin-left:auto;font-size:16px;line-height:1}

/* weekly timetable */
.prog{overflow:hidden}
.prog-head{display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:var(--bw) solid var(--line)}
.prog-head h2{margin:0;display:flex;align-items:center;padding:12px 22px;background:var(--lilac);color:var(--on-tint);border-right:var(--bw) solid var(--line);font:600 17px var(--f-display)}
.prog-tools{flex:1 1 220px;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;min-width:0}
.prog-tools .small-btn{margin-left:auto}
.prog .cform{margin:0 14px 14px}
.tt-wrap{padding:14px}
.tt{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:4px}
.tt-day{grid-row:1;text-align:center;font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:3px 0}
.tt-day.today{background:var(--pink);color:var(--on-tint);border:1.5px solid var(--line);border-radius:999px}
.tt-time{grid-column:1;padding-top:3px;font:700 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.tt-slot{border:1.5px dashed var(--grid);border-radius:8px}
.tt-block{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;text-align:center;
  border:var(--bw) solid var(--line);border-radius:10px;background:var(--k);color:var(--on-tint);box-shadow:2px 3px 0 var(--line);cursor:pointer;overflow:hidden}
.tt-block:disabled{cursor:default}
.tt-block.sel{outline:3px solid var(--line);outline-offset:2px}
.tt-code{font:600 15px/1.1 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.tt-sec{opacity:.7}
.tt-room{font:700 12px var(--f-body)}
.tt-hours{font:700 11px var(--f-body);opacity:.75;font-variant-numeric:tabular-nums}
.tt-block[data-h="1"] .tt-hours{display:none}
.cform{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;padding:14px;background:var(--card);border:var(--bw) solid var(--line);border-radius:12px}
.fld select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;font-weight:600;font-size:14px}
.fld-code{width:120px}.fld-sec{width:64px}.fld-room{width:104px}
.cform-actions{display:flex;align-items:center;gap:10px;padding-bottom:3px}
.small-btn.danger{background:var(--alert);color:var(--alert-on)}

/* custom kinds */
.frow.add{justify-content:center;font-weight:800;font-size:14px;color:var(--muted)}
.kedit{cursor:default}
.kdel-btn{margin-left:8px;border:1.5px solid var(--line);border-radius:999px;background:var(--alert);color:var(--alert-on);padding:1px 10px;font-weight:800;font-size:12px;cursor:pointer}
.kgroup{display:grid;flex:1 1 100%}
.kask{display:grid;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1.5px solid var(--line);font-weight:700;font-size:14px}
.kask p{margin:0}
.kask-acts{display:flex;flex-wrap:wrap;gap:6px}
.kform{display:grid;gap:10px;padding:12px 14px;background:var(--card);border-top:1.5px dashed var(--line)}
.kcolors{display:flex;flex-wrap:wrap;gap:6px}
.kcolors label{position:relative}
.kcolors span{display:block;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--k);cursor:pointer}
.kcolors input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--line)}
.kcolors input:focus-visible+span{outline:3px solid var(--line);outline-offset:3px}

/* Hovered boxes lift toward the viewer: they move up-left and their hard shadow grows. */
@media (hover:hover){
  .ev,.cell,.tt-block,.rail .menu,.banner{transition:transform .14s,box-shadow .14s,background-color .14s}
  .ev:hover{transform:translate(-2px,-3px);box-shadow:5px 7px 0 var(--line)}
  .cell:hover{background:var(--surface);transform:translate(-2px,-3px);box-shadow:4px 5px 0 var(--line);position:relative;z-index:1}
  .tt-block:hover{transform:translate(-2px,-3px);box-shadow:4px 6px 0 var(--line);z-index:2}
  .rail .menu:hover,.banner:hover{transform:translate(-2px,-3px);box-shadow:6px 8px 0 var(--line)}
  .cell.out:hover{transform:none;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:860px){
  .board{grid-template-columns:minmax(0,1fr)}
  .rail{order:-1;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .status{grid-column:1/-1}
}
@media (max-width:600px){
  .rail{grid-template-columns:minmax(0,1fr)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
  .frow,.frow:last-child{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
  .tabs{flex:1 1 100%;border-right:0;border-bottom:var(--bw) solid var(--line)}
  .tab{flex:1}
  .month{padding:10px}
  .dow,.grid{gap:4px}
  .dow span{letter-spacing:0}
  .cell{min-height:58px;align-items:center;padding:4px 2px}
  .cell-top{justify-content:center}
  .warn{display:none}
  .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
  .pill{width:9px;height:9px;padding:0;font-size:0;border-radius:50%}
  .more{display:none}
  .btn-add{padding:0 20px}
  .ev{padding:10px 8px 10px 12px}
  .ev-main{gap:10px}
  :root{--slot-h:46px}
  .prog-head h2{flex:1 1 100%;border-right:0;border-bottom:var(--bw) solid var(--line)}
  .prog .cform{margin:0 8px 10px}
  .tt-wrap{padding:10px 6px}
  .tt{grid-template-columns:34px repeat(5,minmax(0,1fr));gap:3px}
  .tt-time{font-size:10px}
  .tt-block{padding:2px;border-radius:8px;box-shadow:1px 2px 0 var(--line)}
  .tt-code{font-size:11px}
  .tt-sec,.tt-hours{display:none}
  .tt-room{font-size:10px}
}
</style>

<body>
<div class="wrap">
  <header class="brand">
    <svg class="spark" viewBox="0 0 44 20" aria-hidden="true"><rect x="5" y="5" width="9" height="9" transform="rotate(45 9.5 9.5)"/><rect x="27" y="5" width="9" height="9" transform="rotate(45 31.5 9.5)"/></svg>
    <h1 class="mark" aria-label="Takvim"><span>T</span><span>A</span><span>K</span><span>V</span><span>İ</span><span>M</span></h1>
    <svg class="pin" viewBox="0 0 40 58" aria-hidden="true"><line x1="13" y1="16" x2="29" y2="44"/><rect class="tag" x="6" y="5" width="13" height="13" rx="2" transform="rotate(20 12.5 11.5)"/><circle class="bead" cx="30" cy="47" r="7"/></svg>
    <span class="season">güz 2026</span>
  </header>

  <div id="banner" class="banner sticker" aria-label="Yaklaşan son günler" hidden></div>

  <form id="add" class="addbar sticker" autocomplete="off" novalidate>
    <div class="add-top">
      <span id="edit-tag" class="edit-tag" hidden>Düzenle</span>
      <label class="sr" for="f-title">Etkinlik adı</label>
      <input id="f-title" placeholder="Ne var? Örn. CENG 315 - Midterm" maxlength="120">
      <button id="f-submit" class="btn-add" type="submit">Ekle</button>
    </div>
    <div class="add-more">
      <div class="rep" role="radiogroup" aria-labelledby="rep-l">
        <span id="rep-l" class="fl">Tekrar</span>
        <div class="rep-row">
          <div class="kchips">
            <label class="kchip" style="--k:var(--lilac)"><input class="sr" type="radio" name="rep" value="none" checked><span>Tek sefer</span></label>
            <label class="kchip" style="--k:var(--lilac)"><input class="sr" type="radio" name="rep" value="week"><span>Her hafta</span></label>
            <label class="kchip" style="--k:var(--lilac)"><input class="sr" type="radio" name="rep" value="month"><span>Her ay</span></label>
            <label class="kchip" style="--k:var(--lilac)"><input class="sr" type="radio" name="rep" value="year"><span>Her yıl</span></label>
            <label class="kchip" style="--k:var(--lilac)"><input class="sr" type="radio" name="rep" value="custom"><span>Özel</span></label>
          </div>
          <span class="rep-custom" id="rep-custom" hidden>
            Her <input id="r-n" type="number" min="1" max="99" value="2" aria-label="Kaç">
            <select id="r-unit" aria-label="Birim"><option value="day">günde</option><option value="week" selected>haftada</option><option value="month">ayda</option><option value="year">yılda</option></select> bir
          </span>
          <label class="fld fld-date" id="rep-until-f" hidden><span class="fl">Bitiş (isteğe bağlı)</span><input id="r-until" type="date"></label>
        </div>
      </div>
      <label class="fld fld-date"><span class="fl">Tarih</span><input id="f-date" type="date"></label>
      <label class="fld fld-time"><span class="fl">Saat</span><input id="f-time" placeholder="18.30" maxlength="20"></label>
      <label class="fld grow"><span class="fl">Yer</span><input id="f-place" placeholder="KKM A Salonu" maxlength="80"></label>
      <div class="kinds" role="radiogroup" aria-labelledby="kinds-l">
        <span id="kinds-l" class="fl">Tür</span>
        <div class="kchips" id="kchips"></div>
      </div>
      <label class="fld grow"><span class="fl">Not</span><input id="f-note" placeholder="İsteğe bağlı" maxlength="120"></label>
      <label class="tent"><input id="f-tent" type="checkbox"> Tarih kesin değil</label>
      <button id="f-cancel" class="link-btn" type="button" hidden>Vazgeç</button>
    </div>
    <p id="f-msg" class="msg" role="status" hidden></p>
  </form>

  <div class="board">
    <section class="cal sticker" aria-label="Takvim">
      <div class="cal-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" type="button" data-view="month" id="tab-month">Ay</button>
          <button class="tab" role="tab" type="button" data-view="list" id="tab-list">Liste</button>        </div>
        <div class="cal-title">
          <h2 id="title">Takvim</h2>
          <div class="nav" id="nav">
            <button class="icon-btn" id="prev" type="button" aria-label="Önceki ay">‹</button>
            <button class="icon-btn" id="next" type="button" aria-label="Sonraki ay">›</button>
            <button class="small-btn sun" id="today-btn" type="button">Bugün</button>
          </div>
          <button class="small-btn" id="past-btn" type="button" hidden>Geçmişi göster</button>
        </div>
      </div>
      <div id="month-view">
        <div class="month">
          <div class="dow" aria-hidden="true"><span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span></div>
          <div class="grid" id="grid"></div>
        </div>
        <div class="day" id="day"></div>
      </div>
      <div id="list-view" class="list" hidden></div>
    </section>

    <aside class="rail">
      <div class="menu sticker">
        <div class="menu-head">GÖSTER ✦</div>
        <div class="filters" id="filters"></div>
        <form id="kform" class="kform" autocomplete="off" novalidate hidden>
          <label class="fld"><span class="fl">Yeni tür</span><input id="k-name" placeholder="Örn. Kulüp" maxlength="20"></label>
          <div class="kcolors" role="radiogroup" aria-label="Renk" id="kcolors"></div>
          <div class="cform-actions">
            <button class="small-btn sun" type="submit">Ekle</button>
            <button class="link-btn" id="k-cancel" type="button">Vazgeç</button>
          </div>
        </form>
      </div>
      <div class="menu sticker">
        <div class="menu-head sun">SIRADAKİ</div>
        <div class="next-box" id="next-box"></div>
      </div>
      <div class="menu sticker">
        <div class="menu-head lilac">YEDEK</div>
        <div class="filters">
          <button class="frow" id="b-export" type="button">Yedek indir</button>
          <button class="frow" id="b-import" type="button">Yedekten yükle</button>
          <button class="frow" id="b-ics" type="button">Telefon takvimine aktar (.ics)</button>
        </div>
        <input type="file" id="b-file" accept=".json,application/json" hidden>
      </div>
      <p class="status" id="status">Yükleniyor…</p>
    </aside>
  </div>

  <section class="prog sticker" id="program-view" aria-labelledby="prog-title">
    <div class="prog-head">
      <h2 id="prog-title">Ders programı</h2>
      <div class="prog-tools">
        <span class="rel" id="cf-sum"></span>
        <button class="small-btn" id="cf-new" type="button">+ Ders ekle</button>
      </div>
    </div>
    <div class="tt-wrap"><div class="tt" id="program-grid"></div></div>
    <form id="cform" class="cform" autocomplete="off" novalidate hidden>
      <label class="fld fld-code"><span class="fl">Ders kodu</span><input id="c-code" placeholder="CENG 315" maxlength="20"></label>
      <label class="fld fld-sec"><span class="fl">Şube</span><input id="c-sec" placeholder="1" maxlength="6"></label>
      <label class="fld fld-room"><span class="fl">Sınıf</span><input id="c-room" placeholder="BMB1" maxlength="30"></label>
      <label class="fld"><span class="fl">Gün</span><select id="c-day"><option value="0">Pazartesi</option><option value="1">Salı</option><option value="2">Çarşamba</option><option value="3">Perşembe</option><option value="4">Cuma</option></select></label>
      <label class="fld"><span class="fl">Başlangıç</span><select id="c-start"></select></label>
      <label class="fld"><span class="fl">Süre</span><select id="c-hours"><option value="1">1 saat</option><option value="2">2 saat</option><option value="3">3 saat</option><option value="4">4 saat</option><option value="5">5 saat</option></select></label>
      <div class="cform-actions">
        <button class="small-btn sun" id="c-save" type="submit">Kaydet</button>
        <button class="small-btn danger" id="c-del" type="button" hidden>Sil</button>
        <button class="link-btn" id="c-cancel" type="button">Vazgeç</button>
      </div>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const DAYS = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
  const SHORT = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
  const BASE_KINDS = {
    sinav:  {label:"Sınav",  c:"var(--pink)"},
    prova:  {label:"Prova",  c:"var(--teal)"},
    konser: {label:"Konser", c:"var(--sun)"},
    son:    {label:"Son gün", c:"var(--flag)"},
    tatil:  {label:"Tatil",  c:"var(--c6)"},
    dans:   {label:"Dans",   c:"var(--c5)"},
    diger:  {label:"Diğer",  c:"var(--mist)"}
  };
  // Each person can add their own kinds; they live in their profile doc and sit before "Diğer".
  const KIND_COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c7)", "var(--c8)", "var(--lilac)", "var(--teal)"];
  let KINDS = {...BASE_KINDS};
  function buildKinds(custom, hidden = []) {
    const {diger, ...rest} = BASE_KINDS, out = {};
    for (const [k, v] of Object.entries(rest)) if (!hidden.includes(k)) out[k] = v;
    for (const k of custom) out[k.id] = {label: k.label, c: KIND_COLORS[k.color] || KIND_COLORS[0], custom: true};
    out.diger = diger;
    KINDS = out;
  }
  const XSVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 11l10 10M21 11L11 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';

  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const dow = d => (d.getDay() + 6) % 7;
  const lower = s => String(s || "").toLocaleLowerCase("tr");
  const now = new Date();
  const TODAY = keyOf(now);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function saved(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }

  const S = {
    events: [], occ: [], loaded: false, db: null, readOnly: false, base: null,
    kinds: [], kindForm: false, kindEdit: false, kindAsk: null,
    view: saved("tk.view") === "list" ? "list" : "month",
    filter: saved("tk.filter") || "all",
    showPast: false, ym: [now.getFullYear(), now.getMonth()], sel: TODAY, editing: null,
    courses: [], courseForm: null
  };

  function mins(t) {
    const m = String(t || "").trim().match(/^(\d{1,2})[.:](\d{2})$/);
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }
  const allDay = t => lower(t).includes("tüm gün");
  function sortMin(e) {
    if (e.reminder) return -2;
    if (allDay(e.time)) return -1;
    const m = mins(e.time);
    if (m != null) return m;
    const t = lower(e.time);
    if (t.includes("sabah")) return 541;
    if (t.includes("ders saat")) return 601;
    if (t.includes("öğle")) return 721;
    if (t.includes("akşam")) return 1081;
    return 1500;
  }
  const byTime = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (sortMin(a) - sortMin(b)) || a.title.localeCompare(b.title, "tr");
  const dayDiff = k => Math.round((parseKey(k) - parseKey(TODAY)) / 864e5);
  function rel(k) {
    const n = dayDiff(k);
    if (n === 0) return "bugün";
    if (n === 1) return "yarın";
    if (n === -1) return "dün";
    return n > 0 ? `${n} gün sonra` : `${-n} gün önce`;
  }
  function longDate(k) { const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${DAYS[dow(d)]}`; }

  const isKey = k => typeof k === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k);
  const UNIT_LOC = {day: "günde", week: "haftada", month: "ayda", year: "yılda"};
  const UNIT_EVERY = {day: "her gün", week: "her hafta", month: "her ay", year: "her yıl"};
  function normRepeat(r) {
    if (!r || !UNIT_LOC[r.unit]) return null;
    return {every: Math.min(99, Math.max(1, Math.round(Number(r.every) || 1))), unit: r.unit, until: isKey(r.until) ? r.until : ""};
  }
  const repLabel = r => r.every === 1 ? UNIT_EVERY[r.unit] : `${r.every} ${UNIT_LOC[r.unit]} bir`;

  function norm(id, d) {
    if (!d || !isKey(d.date)) return null;
    return {
      id, date: d.date, time: String(d.time || ""), title: String(d.title || "Adsız"),
      place: String(d.place || ""), kind: String(d.kind || "diger"),
      tentative: !!d.tentative, reminder: !!d.reminder, note: String(d.note || ""),
      repeat: normRepeat(d.repeat), skip: Array.isArray(d.skip) ? d.skip.filter(isKey) : []
    };
  }

  // A repeating event is stored once; its dates are unfolded when drawn, up to its end date
  // or a year ahead (further if the month being viewed is later). A 31st or 29 February is
  // skipped in months or years that lack it.
  function nthDate(s, r, i) {
    const n = r.every * i, y = s.getFullYear(), m = s.getMonth(), day = s.getDate();
    if (r.unit === "day") return new Date(y, m, day + n);
    if (r.unit === "week") return new Date(y, m, day + 7 * n);
    const d = new Date(r.unit === "year" ? y + n : y, r.unit === "month" ? m + n : m, day);
    return d.getDate() === day ? d : null;
  }
  function occurrences() {
    const viewEnd = keyOf(new Date(S.ym[0], S.ym[1] + 2, 0));
    const yearEnd = keyOf(new Date(now.getFullYear() + 1, now.getMonth() + 1, 0));
    const horizon = viewEnd > yearEnd ? viewEnd : yearEnd;
    const out = [];
    for (const e of S.events) {
      if (!e.repeat) { out.push(e); continue; }
      const end = e.repeat.until && e.repeat.until < horizon ? e.repeat.until : horizon;
      const skip = new Set(e.skip), start = parseKey(e.date);
      for (let i = 0; i < 1500; i++) {
        const d = nthDate(start, e.repeat, i);
        if (!d) continue;
        const k = keyOf(d);
        if (k > end) break;
        if (!skip.has(k)) out.push({...e, id: `${e.id}@${k}`, date: k, base: e.id});
      }
    }
    return out;
  }

  const kindId = e => KINDS[e.kind] ? e.kind : "diger";
  const kindOf = e => KINDS[kindId(e)];
  const visible = () => S.occ.filter(e => S.filter === "all" || !KINDS[S.filter] || kindId(e) === S.filter);
  const writable = () => !!S.db && !!S.base && !S.readOnly;
  // Everything is kept in this browser's localStorage; nothing leaves the device.
  const STORE_KEY = "guz-takvim.v1";
  let store = {events: {}, courses: {}, kinds: [], hidden: []};
  function loadStore() {
    const raw = localStorage.getItem(STORE_KEY);
    const d = raw ? JSON.parse(raw) : {};
    const obj = x => x && typeof x === "object" && !Array.isArray(x) ? x : {};
    return {events: obj(d.events), courses: obj(d.courses), kinds: Array.isArray(d.kinds) ? d.kinds : [],
      hidden: Array.isArray(d.hidden) ? d.hidden.filter(k => BASE_KINDS[k] && k !== "diger") : []};
  }
  function cleanKinds(raw) {
    return raw.filter(k => k && typeof k.id === "string" && typeof k.label === "string" && !BASE_KINDS[k.id])
      .map(k => ({id: k.id, label: k.label.slice(0, 20), color: Number.isInteger(k.color) ? k.color : 0}));
  }
  function refresh() {
    S.kinds = cleanKinds(store.kinds);
    buildKinds(S.kinds, store.hidden);
    S.events = Object.entries(store.events).map(([id, d]) => norm(id, d)).filter(Boolean);
    S.courses = Object.entries(store.courses).map(([id, d]) => normCourse(id, d)).filter(Boolean);
    S.loaded = true;
    render();
  }
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({v: 1, ...store})); }
    catch (e) {
      try { store = loadStore(); } catch (e2) {}
      refresh();
      return Promise.reject({code: "storage"});
    }
    refresh();
    return Promise.resolve();
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function col(name) {
    return {
      doc: id => ({
        set: data => { store[name][id] = data; return persist(); },
        delete: () => { delete store[name][id]; return persist(); }
      }),
      add: data => { store[name][newId()] = data; return persist(); }
    };
  }
  const profileRef = () => ({set: data => { store.kinds = data.kinds; return persist(); }});
  const evCol = () => col("events");
  const courseCol = () => col("courses");

  // Same day, both within two hours of each other (or one is all-day) counts as a clash.
  function clashes(list) {
    const by = {}, out = new Set();
    for (const e of list) if (e.kind !== "tatil" && !e.reminder) (by[e.date] || (by[e.date] = [])).push(e);
    for (const k in by) {
      const a = by[k];
      for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
        const x = a[i], y = a[j], mx = mins(x.time), my = mins(y.time);
        if (allDay(x.time) || allDay(y.time) || (mx != null && my != null && Math.abs(mx - my) < 120)) { out.add(x.id); out.add(y.id); }
      }
    }
    return out;
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(e, withDate, clash) {
    const k = kindOf(e);
    const li = el("li", "ev" + (e.date < TODAY ? " past" : ""));
    li.style.setProperty("--k", k.c);
    const main = el("button", "ev-main");
    main.type = "button";
    main.disabled = !writable();
    main.setAttribute("aria-label", `Düzenle: ${e.title}, ${longDate(e.date)}`);
    if (withDate) {
      const d = parseKey(e.date), b = el("span", "ev-date");
      b.append(el("b", null, String(d.getDate())), el("small", null, SHORT[dow(d)]));
      main.append(b);
    } else main.append(el("span", "ev-dot"));
    const body = el("span", "ev-body");
    body.append(el("span", "ev-title", e.title));
    const meta = el("span", "ev-meta");
    if (e.time) meta.append(el("b", null, e.time));
    for (const p of [e.place, e.note].filter(Boolean)) { if (meta.childNodes.length) meta.append(" · "); meta.append(p); }
    if (meta.childNodes.length) body.append(meta);
    const chips = el("span", "ev-chips");
    chips.append(el("span", "chip kind", k.label));
    if (e.tentative) chips.append(el("span", "chip tent", "kesin değil"));
    if (e.reminder) chips.append(el("span", "chip", "hatırlatma"));
    if (e.repeat) chips.append(el("span", "chip", repLabel(e.repeat)));
    if (clash.has(e.id)) chips.append(el("span", "chip clash", "çakışma"));
    body.append(chips);
    main.append(body);
    main.onclick = () => startEdit(e);
    li.append(main);
    if (writable()) {
      const del = el("button", "ev-del");
      del.type = "button";
      del.innerHTML = XSVG;
      del.setAttribute("aria-label", `Sil: ${e.title}`);
      del.onclick = () => remove(e, del);
      li.append(del);
    }
    return li;
  }

  function groupByDay(list) {
    const by = {};
    for (const e of list) (by[e.date] || (by[e.date] = [])).push(e);
    for (const k in by) by[k].sort(byTime);
    return by;
  }

  function renderMonth(clash) {
    const [y, m] = S.ym;
    $("#title").textContent = `${MONTHS[m]} ${y}`;
    const lead = dow(new Date(y, m, 1));
    const dim = new Date(y, m + 1, 0).getDate();
    const total = Math.ceil((lead + dim) / 7) * 7;
    const by = groupByDay(visible());
    const grid = $("#grid");
    grid.replaceChildren();
    for (let i = 0; i < total; i++) {
      const d = new Date(y, m, 1 - lead + i), k = keyOf(d), evs = by[k] || [];
      const c = el("button", "cell");
      c.type = "button";
      if (d.getMonth() !== m) c.classList.add("out");
      if (k === TODAY) c.classList.add("today");
      if (k < TODAY) c.classList.add("past");
      c.setAttribute("aria-pressed", String(k === S.sel));
      c.setAttribute("aria-label", longDate(k) + (evs.length ? `, ${evs.length} etkinlik` : ""));
      const top = el("span", "cell-top");
      top.append(el("span", "num", String(d.getDate())));
      if (evs.some(e => clash.has(e.id))) { const w = el("span", "warn", "!"); w.title = "Çakışma var"; top.append(w); }
      c.append(top);
      if (evs.length) {
        const ps = el("span", "pills");
        for (const e of evs.slice(0, 3)) {
          const p = el("span", "pill" + (e.tentative ? " tent" : ""), [e.time, e.title].filter(Boolean).join(" "));
          p.style.setProperty("--k", kindOf(e).c);
          ps.append(p);
        }
        if (evs.length > 3) ps.append(el("span", "more", `+${evs.length - 3}`));
        c.append(ps);
      }
      c.onclick = () => {
        S.sel = k;
        if (d.getMonth() !== m) S.ym = [d.getFullYear(), d.getMonth()];
        if (!S.editing) $("#f-date").value = k;
        render();
      };
      grid.append(c);
    }
    renderDay(by, clash);
  }

  function renderDay(by, clash) {
    const box = $("#day"), k = S.sel;
    box.replaceChildren();
    const head = el("div", "day-head");
    head.append(el("h3", null, longDate(k)), el("span", "rel", rel(k)));
    if (writable()) {
      const b = el("button", "small-btn", "+ Bu güne ekle");
      b.type = "button";
      b.onclick = () => { resetForm(); $("#f-date").value = k; focusForm(); };
      head.append(b);
    }
    box.append(head);
    const evs = by[k] || [];
    if (!S.loaded) box.append(el("p", "empty", "Etkinlikler yükleniyor…"));
    else if (!evs.length) box.append(el("p", "empty", "Bu gün boş."));
    else {
      const ul = el("ul", "evs");
      evs.forEach(e => ul.append(card(e, false, clash)));
      box.append(ul);
    }
  }

  function renderList(clash) {
    const all = visible().sort(byTime);
    const past = all.filter(e => e.date < TODAY);
    const shown = S.showPast ? all : all.filter(e => e.date >= TODAY);
    $("#title").textContent = S.showPast ? "Tüm etkinlikler" : "Yaklaşanlar";
    const pb = $("#past-btn");
    pb.textContent = S.showPast ? "Geçmişi gizle" : `Geçmişi göster (${past.length})`;
    pb.hidden = !past.length;
    const box = $("#list-view");
    box.replaceChildren();
    if (!S.loaded) { box.append(el("p", "empty", "Etkinlikler yükleniyor…")); return; }
    if (!shown.length) {
      box.append(el("p", "empty", S.events.length ? "Bu filtrede yaklaşan etkinlik yok." : "Henüz etkinlik yok. Yukarıdaki kutuya ilkini yaz."));
      return;
    }
    let cur = null, ul;
    for (const e of shown) {
      const mk = e.date.slice(0, 7);
      if (mk !== cur) {

        h.append(el("span", null, `${MONTHS[d.getMonth()].toLocaleUpperCase("tr")} ${d.getFullYear()}`),
                 el("span", "mcount", String(shown.filter(x => x.date.startsWith(mk)).length)));
        ul = el("ul", "evs");
        sec.append(h, ul);
        box.append(sec);
      }
      ul.append(card(e, true, clash));
    }
  }

  function renderFilters() {
    const f = $("#filters"), counts = {};
    f.replaceChildren();
    S.events.forEach(e => { counts[kindId(e)] = (counts[kindId(e)] || 0) + 1; });
    const rows = [["all", "Hepsi", null, S.events.length]].concat(Object.entries(KINDS).map(([k, v]) => [k, v.label, v.c, counts[k] || 0]));
    for (const [k, label, c, n] of rows) {
      if (S.kindEdit && k !== "all" && k !== "diger") { f.append(kindEditRow(k, label, c, n)); continue; }
      if (k === "diger" && !n && S.filter !== "diger") continue;
      const b = el("button", "frow");
      b.type = "button";
      b.setAttribute("aria-pressed", String(S.filter === k));
      if (c) { const s = el("span", "sw"); s.style.setProperty("--k", c); b.append(s); }
      b.append(el("span", null, label), el("span", "cnt", String(n)));
      b.onclick = () => { S.filter = k; saved("tk.filter", k); render(); };
      f.append(b);
    }
    const p = el("button", "frow");
    p.type = "button";
    const sw = el("span", "sw");
    sw.style.setProperty("--k", "var(--lilac)");
    p.append(sw, el("span", null, "Ders programı"), el("span", "cnt", String(new Set(S.courses.map(c => c.code)).size)));
    p.onclick = () => $("#program-view").scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"});
    f.append(p);
    if (writable() && !S.kindForm && !S.kindEdit) {
      const a = el("button", "frow add", "+ Tür ekle");
      a.type = "button";
      a.onclick = () => { S.kindForm = true; render(); $("#k-name").focus(); };
      f.append(a);
    }
    if (writable() && !S.kindForm) {
      const t = el("button", "frow add", S.kindEdit ? "Bitti" : "Türleri düzenle");
      t.type = "button";
      t.onclick = () => { S.kindEdit = !S.kindEdit; S.kindAsk = null; render(); };
      f.append(t);
    }
    renderKindForm();
  }

  // Kind radios in the add bar are rebuilt only when the set of kinds changes, so a picked kind survives re-renders.
  let kindSig = "";
  function renderKindChips() {
    const sig = Object.entries(KINDS).map(([k, v]) => k + v.label + v.c).join("|");
    if (sig === kindSig) return;
    kindSig = sig;
    const box = $("#kchips"), cur = form.querySelector('input[name="kind"]:checked');
    const keep = cur && KINDS[cur.value] ? cur.value : "sinav";
    box.replaceChildren();
    for (const [k, v] of Object.entries(KINDS)) {
      const lab = el("label", "kchip"), inp = el("input", "sr"), sp = el("span", null, v.label);
      lab.style.setProperty("--k", v.c);
      inp.type = "radio"; inp.name = "kind"; inp.value = k;
      inp.defaultChecked = k === "sinav";
      inp.checked = k === keep;
      inp.disabled = !writable();
      lab.append(inp, sp);
      box.append(lab);

  const kform = $("#kform");
  KIND_COLORS.forEach((c, i) => {
    const lab = el("label"), inp = el("input", "sr"), sp = el("span");
    inp.type = "radio"; inp.name = "kcolor"; inp.value = String(i);
    inp.setAttribute("aria-label", `Renk ${i + 1}`);
    if (i === 0) inp.checked = true;
    sp.style.setProperty("--k", c);
    lab.append(inp, sp);
    $("#kcolors").append(lab);
  });

  function renderKindForm() {
    kform.hidden = !S.kindForm || !writable();
  }

  async function saveKinds(list) {
    await profileRef().set({kinds: list});
  }

  kform.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!writable()) return;
    const label = $("#k-name").value.trim().replace(/\s+/g, " ");
    if (!label) { toast("Türe bir ad ver."); $("#k-name").focus(); return; }
    if (Object.values(KINDS).some(v => lower(v.label) === lower(label))) { toast("Bu adda bir tür zaten var."); return; }
    if (S.kinds.length >= 12) { toast("En fazla 12 kendi türün olabilir."); return; }
    const color = Number((kform.querySelector('input[name="kcolor"]:checked') || {}).value || 0);
    const id = "k" + Date.now().toString(36);
    try {
      await saveKinds([...S.kinds, {id, label, color}]);
      $("#k-name").value = "";
      S.kindForm = false;
      render();
      toast(`Tür eklendi: ${label}`);

  });
  $("#k-cancel").onclick = () => { S.kindForm = false; render(); };

  // In edit mode each kind gets a delete button; deleting asks whether its events move to "Diğer" or go with it.
  function kindEditRow(k, label, c, n) {
    const row = el("div", "frow kedit");
    const sw = el("span", "sw");
    sw.style.setProperty("--k", c);
    const del = el("button", "kdel-btn", "Sil");
    del.type = "button";
    del.setAttribute("aria-label", `Türü sil: ${label}`);
    del.onclick = () => { S.kindAsk = S.kindAsk === k ? null : k; render(); };
    row.append(sw, el("span", null, label), el("span", "cnt", String(n)), del);
    if (S.kindAsk !== k) return row;
    const group = el("div", "kgroup"), ask = el("div", "kask"), acts = el("div", "kask-acts");
    ask.append(el("p", null, n ? `${label} türünü siliyorsun. ${n} etkinliği ne olsun?` : `${label} türü silinsin mi?`));
    const action = (text, cls, fn) => { const b = el("button", "small-btn" + (cls ? " " + cls : ""), text); b.type = "button"; b.onclick = fn; acts.append(b); };
    if (n) {
      action("Diğer'e taşı", "sun", () => deleteKind(k, label, "move"));
      action("Onları da sil", "danger", () => deleteKind(k, label, "drop"));
    } else action("Sil", "danger", () => deleteKind(k, label, "move"));
    action("Vazgeç", "", () => { S.kindAsk = null; render(); });
    ask.append(acts);
    group.append(row, ask);
    return group;
  }

  function deleteKind(k, label, mode) {
    if (!writable()) return;
    const before = JSON.stringify(store);
    let dropped = 0;
    for (const [id, d] of Object.entries(store.events)) {
      if ((KINDS[d.kind] ? d.kind : "diger") !== k) continue;
      if (mode === "drop") { delete store.events[id]; dropped++; }
      else store.events[id] = {...d, kind: "diger"};
    }
    if (BASE_KINDS[k]) store.hidden = [...new Set([...store.hidden, k])];
    else store.kinds = store.kinds.filter(x => x.id !== k);
    S.kindAsk = null;
    if (S.filter === k) { S.filter = "all"; saved("tk.filter", "all"); }
    const text = dropped ? `${label} ve ${dropped} etkinliği silindi` : `${label} silindi`;
    persist().then(
      () => toast(text, {label: "Geri al", run: () => { store = JSON.parse(before); persist().then(() => toast("Geri alındı"), writeFailed); }}),
      writeFailed
    );
  }

  function renderNext() {
    const box = $("#next-box");
    box.replaceChildren();
    if (!S.loaded) { box.append(el("p", "empty", "Yükleniyor…")); return; }
    const up = visible().filter(e => e.date >= TODAY).sort(byTime).slice(0, 3);
    if (!up.length) { box.append(el("p", "empty", "Yaklaşan etkinlik yok.")); return; }
    for (const e of up) {
      const d = parseKey(e.date), b = el("button", "nx");
      b.type = "button";
      b.style.setProperty("--k", kindOf(e).c);
      b.append(
        el("span", "nx-when", `${d.getDate()} ${MONTHS[d.getMonth()]} ${SHORT[dow(d)]}${e.time ? " · " + e.time : ""}`),
        el("span", "nx-title", e.title),
        el("span", "nx-rel", rel(e.date) + (e.tentative ? " · kesin değil" : ""))
      );
      b.onclick = () => {
        S.view = "month"; S.sel = e.date; S.ym = [d.getFullYear(), d.getMonth()];
        render();
        $("#day").scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "nearest"});
      };
      box.append(b);
    }
  }

  function renderStatus() {
    let t;
    if (!S.loaded) t = "Bağlanıyor…";
    else if (!S.db) t = "Bu tarayıcı kayıt tutmaya izin vermiyor. Gizli sekmedeysen normal bir pencerede aç.";
    else t = `${S.events.length} etkinlik · yalnızca bu cihazda kaydedilir`;
    $("#status").textContent = t;
    const off = !writable();
    form.querySelectorAll("input,button,select").forEach(x => { x.disabled = off; });
    cform.querySelectorAll("input,select,button").forEach(x => { x.disabled = off; });
  }

  // Deadlines in the next 30 days stay pinned above everything as a countdown.
  // Collapsed, the banner shows only the nearest deadline; a click unfolds the full list.
  let bannerOpen = saved("tk.banner") === "open";
  function renderBanner() {
    const box = $("#banner");
    const up = S.occ.filter(e => e.kind === "son" && !e.reminder && e.date >= TODAY && dayDiff(e.date) <= 30).sort(byTime);
    box.replaceChildren();
    box.hidden = !up.length;
    if (!up.length) return;
    const count = n => n === 0 ? "Bugün" : n === 1 ? "Yarın" : `${n} gün kaldı`;
    const head = el("button", "bn-row bn-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(bannerOpen));
    if (bannerOpen) head.append(el("span", "bn-text", `Yaklaşan son günler (${up.length})`));
    else {
      const first = up[0];
      head.append(el("span", "bn-count", count(dayDiff(first.date))), el("span", "bn-text", first.title));
      if (up.length > 1) head.append(el("span", "bn-more", `+${up.length - 1} daha`));
    }
    head.append(el("span", "bn-chev", bannerOpen ? "▴" : "▾"));
    head.onclick = () => { bannerOpen = !bannerOpen; saved("tk.banner", bannerOpen ? "open" : "closed"); renderBanner(); };
    box.append(head);
    if (!bannerOpen) return;
    for (const e of up) {
      const d = parseKey(e.date), row = el("button", "bn-row");
      row.type = "button";
      row.append(
        el("span", "bn-count", count(dayDiff(e.date))),
        el("span", "bn-text", e.title),
        el("span", "bn-when", longDate(e.date) + (e.time ? " · " + e.time : ""))
      );
      row.onclick = () => { S.view = "month"; S.sel = e.date; S.ym = [d.getFullYear(), d.getMonth()]; render(); };
      box.append(row);
    }
  }


  function render() {
    S.occ = occurrences();
    const clash = clashes(S.occ);
    const v = S.view;
    $("#month-view").hidden = v !== "month";
    $("#list-view").hidden = v !== "list";
    $("#nav").hidden = v !== "month";
    $("#past-btn").hidden = v !== "list";
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === v)));
    renderKindChips();
    renderFilters();
    renderNext();
    renderBanner();
    v === "list" ? renderList(clash) : renderMonth(clash);
    renderProgram();
    renderStatus();
  }

  /* form */
  const form = $("#add");
  let msgTimer;
  function msg(text) {
    const m = $("#f-msg");
    m.textContent = text;
    m.hidden = !text;
    clearTimeout(msgTimer);
    if (text) msgTimer = setTimeout(() => { m.hidden = true; }, 4000);
  }
  const repChoice = () => (form.querySelector('input[name="rep"]:checked') || {}).value || "none";
  function syncRepeat() {
    const v = repChoice();
    $("#rep-custom").hidden = v !== "custom";
    $("#rep-until-f").hidden = v === "none";
  }
  form.querySelectorAll('input[name="rep"]').forEach(r => { r.onchange = syncRepeat; });

  function readRepeat() {
    const v = repChoice();
    if (v === "none") return null;
    const r = v === "custom" ? {every: Number($("#r-n").value), unit: $("#r-unit").value} : {every: 1, unit: v};
    const until = $("#r-until").value;
    return normRepeat(until ? {...r, until} : r);
  }
  function setRepeat(r) {
    const preset = r && r.every === 1 && r.unit !== "day" ? r.unit : r ? "custom" : "none";
    form.querySelector(`input[name="rep"][value="${preset}"]`).checked = true;
    $("#r-n").value = r && preset === "custom" ? String(r.every) : "2";
    $("#r-unit").value = r && preset === "custom" ? r.unit : "week";
    $("#r-until").value = r ? r.until : "";
    syncRepeat();
  }

  function readForm() {
    const k = form.querySelector('input[name="kind"]:checked');
    const data = {
      date: $("#f-date").value, time: $("#f-time").value.trim(), title: $("#f-title").value.trim(),
      place: $("#f-place").value.trim(), kind: k ? k.value : "diger",
      tentative: $("#f-tent").checked, note: $("#f-note").value.trim()
    };
    const r = readRepeat();
    if (r) data.repeat = r.until ? r : {every: r.every, unit: r.unit};
    return data;
  }
  function resetForm() {
    const d = $("#f-date").value;
    S.editing = null;
    form.reset();
    setRepeat(null);
    $("#f-date").value = d || S.sel;
    form.classList.remove("editing");
    $("#f-submit").textContent = "Ekle";
    $("#f-cancel").hidden = true;
    $("#edit-tag").hidden = true;
    msg("");
  }
  function focusForm() {
    form.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "nearest"});
    $("#f-title").focus({preventScroll: true});
  }
  // Clicking one date of a repeating event edits the whole series, starting from its first date.
  function startEdit(occ) {
    if (!writable()) return;
    const e = occ.base ? S.events.find(x => x.id === occ.base) : occ;
    if (!e) return;
    S.editing = e.id;
    setRepeat(e.repeat);
    $("#edit-tag").textContent = e.repeat ? "Tüm tekrarlar" : "Düzenle";
    $("#f-title").value = e.title;
    $("#f-date").value = e.date;
    $("#f-time").value = e.time;
    $("#f-place").value = e.place;
    $("#f-note").value = e.note;
    $("#f-tent").checked = e.tentative;
    const r = form.querySelector(`input[name="kind"][value="${kindId(e)}"]`);
    if (r) r.checked = true;
    form.classList.add("editing");
    $("#f-submit").textContent = "Kaydet";
    $("#f-cancel").hidden = false;
    $("#edit-tag").hidden = false;
    msg("");
    focusForm();
  }

  function writeFailed(err) {
    const c = err && err.code;
    if (c === "storage") toast("Kaydedilemedi: tarayıcı depolaması dolu ya da kapalı.");
    else toast("Kaydedilemedi. Bir daha dene.");
  }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!writable()) return;
    const data = readForm();
    const prevEv = S.editing && S.events.find(x => x.id === S.editing);
    if (prevEv && prevEv.reminder) data.reminder = true;
    if (prevEv && data.repeat && prevEv.skip.length) data.skip = prevEv.skip;
    if (!data.title) { msg("Bir başlık yaz."); $("#f-title").focus(); return; }
    if (!isKey(data.date)) { msg("Bir tarih seç."); $("#f-date").focus(); return; }
    if (data.repeat && data.repeat.until && data.repeat.until < data.date) { msg("Bitiş, başlangıç tarihinden önce olamaz."); $("#r-until").focus(); return; }
    const btn = $("#f-submit"), wasEdit = S.editing;
    btn.disabled = true;
    try {
      if (wasEdit) await evCol().doc(wasEdit).set(data);
      else await evCol().add(data);
      const d = parseKey(data.date);
      S.sel = data.date;
      S.ym = [d.getFullYear(), d.getMonth()];
      resetForm();
      $("#f-date").value = data.date;
      render();
      toast(wasEdit ? "Kaydedildi" : `Eklendi: ${longDate(data.date)}`);
    } catch (err) { writeFailed(err); }
    finally { btn.disabled = !writable(); }
  });
  $("#f-cancel").onclick = resetForm;

  function remove(e, btn) {
    if (!writable()) return;
    if (e.base) { askSeries(e, btn); return; }
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1";
      btn.textContent = "Sil?";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.dataset.armed = ""; btn.innerHTML = XSVG; }, 3000);
      return;
    }
    clearTimeout(btn._t);
    deleteEvent(e.id, "Silindi");
  }

  // Undo puts back the stored document exactly as it was.
  function restoreLater(id, raw, text) {
    toast(text, {label: "Geri al", run: () => evCol().doc(id).set(raw).then(() => toast("Geri alındı"), writeFailed)});
  }
  function deleteEvent(id, text) {
    const raw = store.events[id];
    evCol().doc(id).delete().then(() => {
      if (S.editing === id) resetForm();
      restoreLater(id, raw, text);
    }, writeFailed);
  }

  // On one date of a repeating event, the delete button asks whether to drop that date or the whole series.
  function askSeries(e, btn) {
    const raw = store.events[e.base];
    if (!raw) return;
    const box = el("span", "ev-ask");
    const one = el("button", "small-btn", "Sadece bunu"), all = el("button", "small-btn danger", "Tümünü sil");
    one.type = all.type = "button";
    one.onclick = () => {
      const skip = Array.isArray(raw.skip) ? raw.skip : [];
      evCol().doc(e.base).set({...raw, skip: [...skip, e.date]})
        .then(() => restoreLater(e.base, raw, `${longDate(e.date)} kaldırıldı`), writeFailed);
    };
    all.onclick = () => deleteEvent(e.base, "Tüm tekrarlar silindi");
    box.append(one, all);
    btn.replaceWith(box);
    one.focus();
    setTimeout(() => { if (box.isConnected) box.replaceWith(btn); }, 5000);
  }

  let toastTimer;
  function toast(text, action) {
    const t = $("#toast");
    t.replaceChildren(el("span", null, text));
    if (action) {
      const b = el("button", null, action.label);
      b.type = "button";
      b.onclick = () => { t.hidden = true; action.run(); };
      t.append(b);
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, action ? 6000 : 2600);
  }

  /* weekly timetable: METU slots start at :40 and last 50 minutes */
  const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
  const hhmm = m => `${pad(Math.floor(m / 60))}.${pad(m % 60)}`;
  const cform = $("#cform");
  for (let t = 8 * 60 + 40; t <= 17 * 60 + 40; t += 60) {
    const o = el("option", null, hhmm(t));
    o.value = hhmm(t);
    $("#c-start").append(o);
  }

  function normCourse(id, d) {
    if (!d || typeof d.code !== "string") return null;
    const day = Number(d.day), start = mins(d.start);
    if (!(day >= 0 && day <= 4) || start == null) return null;
    return {
      id, code: d.code.trim() || "Ders", section: String(d.section || ""), room: String(d.room || ""),
      day, start, hours: Math.min(5, Math.max(1, Math.round(Number(d.hours) || 1))),
      color: Number.isInteger(d.color) ? ((d.color % COLORS.length) + COLORS.length) % COLORS.length : 0,
      until: typeof d.until === "string" ? d.until : ""
    };
  }

  function renderProgram() {
    const grid = $("#program-grid"), cs = S.courses.filter(c => !c.until || c.until >= TODAY);
    grid.replaceChildren();
    let first = 8 * 60 + 40, last = 16 * 60 + 40;
    for (const c of cs) { first = Math.min(first, c.start); last = Math.max(last, c.start + (c.hours - 1) * 60); }
    const rows = Math.floor((last - first) / 60) + 1;
    grid.style.gridTemplateRows = `auto repeat(${rows}, var(--slot-h))`;
    const todayIdx = dow(now);
    SHORT.slice(0, 5).forEach((d, i) => {
      const h = el("span", "tt-day" + (i === todayIdx ? " today" : ""), d);
      h.style.gridColumn = String(i + 2);
      grid.append(h);
    });
    for (let r = 0; r < rows; r++) {
      const lab = el("span", "tt-time", hhmm(first + r * 60));
      lab.style.gridRow = String(r + 2);
      grid.append(lab);
      for (let i = 0; i < 5; i++) {
        const s = el("span", "tt-slot");
        s.style.gridRow = String(r + 2);
        s.style.gridColumn = String(i + 2);
        grid.append(s);
      }
    }
    for (const c of cs) {
      const b = el("button", "tt-block" + (S.courseForm === c.id ? " sel" : ""));
      b.type = "button";
      b.disabled = !writable();
      const metu = c.start % 60 === 40;
      b.dataset.h = metu ? String(c.hours) : "free";
      b.style.gridColumn = String(c.day + 2);
      b.style.gridRow = `${Math.round((c.start - first) / 60) + 2} / span ${c.hours}`;
      b.style.setProperty("--k", COLORS[c.color]);
      const code = el("span", "tt-code", c.code);
      if (c.section) code.append(el("span", "tt-sec", "/" + c.section));
      b.append(code);
      if (c.room) b.append(el("span", "tt-room", c.room));
      b.append(el("span", "tt-hours", `${hhmm(c.start)}–${hhmm(c.start + c.hours * 60 - (metu ? 10 : 0))}`));
      b.setAttribute("aria-label", `${c.code}, ${DAYS[c.day]} ${hhmm(c.start)}${c.room ? ", " + c.room : ""}`);
      if (c.until) { const u = parseKey(c.until); b.title = `${u.getDate()} ${MONTHS[u.getMonth()]} tarihine kadar`; }
      b.onclick = () => openCourse(c);
      grid.append(b);
    }
    const hours = cs.reduce((n, c) => n + c.hours, 0);
    $("#cf-sum").textContent = !S.loaded ? "yükleniyor…"
      : cs.length ? `${new Set(cs.map(c => c.code)).size} ders · haftada ${hours} saat` : "henüz ders yok";
    $("#cf-new").hidden = !writable();
    cform.hidden = !S.courseForm || !writable();
  }

  function pickColor(code, selfId) {
    const key = lower(code).replace(/\s+/g, "");
    const others = S.courses.filter(c => c.id !== selfId);
    const same = others.find(c => lower(c.code).replace(/\s+/g, "") === key);
    if (same) return same.color;
    const used = new Set(others.map(c => c.color));
    for (let i = 0; i < COLORS.length; i++) if (!used.has(i)) return i;
    return [...key].reduce((n, ch) => n + ch.charCodeAt(0), 0) % COLORS.length;
  }

  function resetArm(btn) { clearTimeout(btn._t); btn.dataset.armed = ""; btn.textContent = "Sil"; }

  function openCourse(c) {
    if (!writable()) return;
    S.courseForm = c ? c.id : "new";
    const start = c ? hhmm(c.start) : "08.40";
    if (![...$("#c-start").options].some(o => o.value === start)) {
      const o = el("option", null, start);
      o.value = start;
      $("#c-start").append(o);
    }
    $("#c-code").value = c ? c.code : "";
    $("#c-sec").value = c ? c.section : "";
    $("#c-room").value = c ? c.room : "";
    $("#c-day").value = String(c ? c.day : (dow(now) < 5 ? dow(now) : 0));
    $("#c-start").value = start;
    $("#c-hours").value = String(c ? c.hours : 1);
    $("#c-del").hidden = !c;
    resetArm($("#c-del"));
    render();
    cform.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "nearest"});
    $("#c-code").focus({preventScroll: true});
  }

  cform.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!writable() || !S.courseForm) return;
    const code = $("#c-code").value.trim().replace(/\s+/g, " ").toLocaleUpperCase("tr");
    if (!code) { toast("Ders kodunu yaz."); $("#c-code").focus(); return; }
    const id = S.courseForm === "new" ? null : S.courseForm;
    const prev = id && S.courses.find(c => c.id === id);
    const data = {
      code, section: $("#c-sec").value.trim(), room: $("#c-room").value.trim(),
      day: Number($("#c-day").value), start: $("#c-start").value, hours: Number($("#c-hours").value),
      color: prev && prev.code === code ? prev.color : pickColor(code, id)
    };
    if (prev && prev.until) data.until = prev.until;
    const btn = $("#c-save");
    btn.disabled = true;
    try {
      if (id) await courseCol().doc(id).set(data);
      else await courseCol().add(data);
      S.courseForm = null;
      render();
      toast(id ? "Ders kaydedildi" : "Ders eklendi");
    } catch (err) { writeFailed(err); }
    finally { btn.disabled = !writable(); }
  });

  $("#c-del").onclick = () => {
    const btn = $("#c-del"), id = S.courseForm, c = S.courses.find(x => x.id === id);
    if (!c || !writable()) return;
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1";
      btn.textContent = "Emin misin?";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => resetArm(btn), 3000);
      return;
    }
    resetArm(btn);
    const data = {code: c.code, section: c.section, room: c.room, day: c.day, start: hhmm(c.start), hours: c.hours, color: c.color, until: c.until};
    courseCol().doc(id).delete().then(() => {
      S.courseForm = null;
      render();
      toast("Ders silindi", {label: "Geri al", run: () => courseCol().doc(id).set(data).then(() => toast("Geri alındı"), writeFailed)});
    }, writeFailed);
  };
  $("#c-cancel").onclick = () => { S.courseForm = null; render(); };
  $("#cf-new").onclick = () => openCourse(null);

  /* navigation */
  document.querySelectorAll(".tab").forEach(t => { t.onclick = () => { S.view = t.dataset.view; saved("tk.view", S.view); render(); }; });
  const shiftMonth = n => { const d = new Date(S.ym[0], S.ym[1] + n, 1); S.ym = [d.getFullYear(), d.getMonth()]; render(); };
  $("#prev").onclick = () => shiftMonth(-1);
  $("#next").onclick = () => shiftMonth(1);
  $("#today-btn").onclick = () => { S.ym = [now.getFullYear(), now.getMonth()]; S.sel = TODAY; if (!S.editing) $("#f-date").value = TODAY; render(); };
  $("#past-btn").onclick = () => { S.showPast = !S.showPast; render(); };

  $("#f-date").value = TODAY;
  render();

  /* backup: download, restore and calendar export */
  function download(name, text, type) {
    const a = el("a");
    a.href = URL.createObjectURL(new Blob([text], {type}));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $("#b-export").onclick = () => {
    download(`takvim-yedek-${TODAY}.json`, JSON.stringify({v: 1, ...store}, null, 1), "application/json");
    toast("Yedek indirildi");
  };

  $("#b-import").onclick = () => { if (writable()) $("#b-file").click(); };
  // A restore merges into what is already here; documents with the same id are replaced.
  $("#b-file").onchange = async ev => {
    const f = ev.target.files[0];
    ev.target.value = "";
    if (!f || !writable()) return;
    let d;
    try { d = JSON.parse(await f.text()); } catch (e) { toast("Bu dosya okunamadı."); return; }
    const obj = x => x && typeof x === "object" && !Array.isArray(x) ? x : null;
    const evs = obj(d && d.events) || {}, cs = obj(d && d.courses) || {};
    const ks = cleanKinds(Array.isArray(d && d.kinds) ? d.kinds : []);
    const okEv = Object.entries(evs).filter(([id, x]) => norm(id, x));
    const okCs = Object.entries(cs).filter(([id, x]) => normCourse(id, x));
    if (!okEv.length && !okCs.length && !ks.length) { toast("Dosyada takvim verisi yok."); return; }
    const before = JSON.stringify(store);
    for (const [id, x] of okEv) store.events[id] = x;
    for (const [id, x] of okCs) store.courses[id] = x;
    const have = new Set(store.kinds.map(k => k.id));
    for (const k of ks) if (!have.has(k.id)) store.kinds.push(k);
    persist().then(
      () => toast(`${okEv.length} etkinlik, ${okCs.length} ders yüklendi`),
      err => { store = JSON.parse(before); writeFailed(err); }
    );
  };

  function icsText() {
    const esc = t => String(t).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
    const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const hm = m => pad(Math.floor(m / 60)) + pad(m % 60) + "00";
    const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Guz Takvimi//TR", "CALSCALE:GREGORIAN"];
    for (const e of S.events) {
      if (e.reminder) continue;
      const d = e.date.replace(/-/g, ""), m = mins(e.time);
      out.push("BEGIN:VEVENT", `UID:${e.id}@guz-takvimi`, `DTSTAMP:${stamp}`);
      if (m != null) out.push(`DTSTART:${d}T${hm(m)}`, `DTEND:${d}T${hm(Math.min(m + 60, 23 * 60 + 59))}`);
      else {
        const next = new Date(parseKey(e.date).getTime() + 864e5);
        out.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${keyOf(next).replace(/-/g, "")}`);
      }
      if (e.repeat) {
        const freq = {day: "DAILY", week: "WEEKLY", month: "MONTHLY", year: "YEARLY"}[e.repeat.unit];
        const until = e.repeat.until ? `;UNTIL=${e.repeat.until.replace(/-/g, "")}${m != null ? "T235959" : ""}` : "";
        out.push(`RRULE:FREQ=${freq};INTERVAL=${e.repeat.every}${until}`);
        for (const k of e.skip) {
          const x = k.replace(/-/g, "");
          out.push(m != null ? `EXDATE:${x}T${hm(m)}` : `EXDATE;VALUE=DATE:${x}`);
        }
      }
      out.push(`SUMMARY:${esc((e.tentative ? "(kesin değil) " : "") + e.title)}`);
      if (e.place) out.push(`LOCATION:${esc(e.place)}`);
      const desc = [kindOf(e).label, m == null ? e.time : "", e.note].filter(Boolean).join(" · ");
      if (desc) out.push(`DESCRIPTION:${esc(desc)}`);
      out.push("END:VEVENT");
    }
    out.push("END:VCALENDAR");
    return out.join("\r\n") + "\r\n";
  }
  $("#b-ics").onclick = () => {
    if (!S.events.length) { toast("Aktarılacak etkinlik yok."); return; }
    download("guz-takvim.ics", icsText(), "text/calendar");
    toast("Dosyayı aç, telefonun takvimine eklenir");
  };

  /* load: probe storage once, then read */
  try {
    localStorage.setItem(STORE_KEY + ".probe", "1");
    localStorage.removeItem(STORE_KEY + ".probe");
    store = loadStore();
    S.db = true;
    S.base = "local";
  } catch (e) { S.db = null; }
  S.loaded = true;
  if (S.db) refresh(); else render();
  // Another tab of the same page saved: pick up its version.
  window.addEventListener("storage", ev => {
    if (ev.key !== STORE_KEY) return;
    try { store = loadStore(); refresh(); } catch (e) {}
  });
})();
</script>
</body>
</html>
